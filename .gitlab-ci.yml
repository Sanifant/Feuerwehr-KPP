# GitLab CI/CD Pipeline for Feuerwehr Multi-Platform Application
# Supports: Web API, Desktop (MAUI), Mobile (Android/Browser), iOS (macOS only)
# .NET 10 Target Framework

# ### Define Pipeline Stages
stages:
  - restore
  - build
  - test
  - analyze
  - package
  - deploy

# ### Default Docker Image for .NET 10
# Note: If mcr.microsoft.com/dotnet/sdk:10.0 is not available yet,
# use the latest preview or nightly build image
# Alternative: mcr.microsoft.com/dotnet/nightly/sdk:10.0-preview
image: mcr.microsoft.com/dotnet/sdk:10.0

# ### Define variables
variables:
  # Build Configuration
  CONFIGURATION: 'Release'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

  # Paths
  SOURCE_CODE_PATH: 'src/'
  OBJECTS_DIRECTORY: 'obj'
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  ARTIFACTS_PATH: 'artifacts/'

  # Project Paths
  PROJECT_MODELS: 'Common/domain/de.openelp.feuerwehr.domain.csproj'
  PROJECT_WEB_API: 'Web/api/de.openelp.feuerwehr.Api.csproj'
  PROJECT_DESKTOP: 'Desktop/desktop/de.openelp.feuerwehr.desktop.csproj'
  PROJECT_MOBILE: 'Mobile/mobile/de.openelp.feuerwehr.mobile.csproj'
  PROJECT_MOBILE_ANDROID: 'Mobile/mobile.Android/de.openelp.feuerwehr.mobile.Android.csproj'
  PROJECT_MOBILE_DESKTOP: 'Mobile/mobile.Desktop/de.openelp.feuerwehr.mobile.Desktop.csproj'
  PROJECT_INFRASTRUCTURE: 'Common/infrastructure/de.openelp.feuerwehr.infrastructure.csproj'
  PROJECT_DOMAIN: 'Common/domain/de.openelp.feuerwehr.domain.csproj'
  PROJECT_APPLICATION: 'Common/application/de.openelp.feuerwehr.application.csproj'

  # Test Project Paths
  TEST_API: '../Web/api.UnitTests/de.openelp.feuerwehr.Api.UnitTests.csproj'
  TEST_INFRASTRUCTURE: '../Common/infrastructure.UnitTests/de.openelp.feuerwehr.infrastructure.UnitTests.csproj'
  TEST_DOMAIN: '../Common/domain.UnitTests/de.openelp.feuerwehr.domain.UnitTests.csproj'
  TEST_APPLICATION: '../Common/application.UnitTests/de.openelp.feuerwehr.application.UnitTests.csproj'
  TEST_DESKTOP: '../Desktop/desktop.UnitTests/de.openelp.feuerwehr.desktop.UnitTests.csproj'
  TEST_MOBILE_DESKTOP: '../Mobile/mobile.Desktop.UnitTests/de.openelp.feuerwehr.mobile.Desktop.UnitTests.csproj'
  TEST_MOBILE_ANDROID: '../Mobile/mobile.Android.UnitTests/de.openelp.feuerwehr.mobile.Android.UnitTests.csproj'

  # Versioning
  VERSION_PREFIX: '1.0.0'
  VERSION_SUFFIX: 'ci-$CI_PIPELINE_IID'

  # Docker
  DOCKER_REGISTRY: '$CI_REGISTRY'
  DOCKER_IMAGE_API: '$CI_REGISTRY_IMAGE/api'

# ### Global Cache Configuration
cache:
  key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
  paths:
    - '$NUGET_PACKAGES_DIRECTORY'
    - '$SOURCE_CODE_PATH*/$OBJECTS_DIRECTORY/project.assets.json'
    - '$SOURCE_CODE_PATH*/$OBJECTS_DIRECTORY/*.csproj.nuget.*'
    - '$SOURCE_CODE_PATH**/$OBJECTS_DIRECTORY/project.assets.json'
    - '$SOURCE_CODE_PATH**/$OBJECTS_DIRECTORY/*.csproj.nuget.*'
  policy: pull-push

# ### Global Setup Script
before_script:
  - cd $SOURCE_CODE_PATH
  - echo "Pipeline running for branch $CI_COMMIT_REF_NAME"
  - dotnet --info

# ============================================================
# RESTORE STAGE
# ============================================================
# Note: .NET 10 Android workload may not be fully available yet.
# Android builds are configured with allow_failure: true to
# allow the pipeline to continue even if Android builds fail.
# This is expected behavior for preview versions of .NET.
# ============================================================

setup-workloads:
  stage: restore
  before_script:
    - cd $SOURCE_CODE_PATH
    - dotnet --info
    - echo "Configuring NuGet sources for workload installation..."
    - dotnet nuget list source || true
  script:
    - echo "Installing .NET Workloads for MAUI development..."
    - echo "??  Note Some workloads may not be available for .NET 10 preview yet"
    - echo "Current workloads:"
    - dotnet workload list || true
    - echo ""
    - echo "Attempting to install android workload with multiple feeds..."
    - |
      dotnet workload install android \
        --source https://api.nuget.org/v3/index.json \
        --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet10/nuget/v3/index.json \
        --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public/nuget/v3/index.json \
        --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json \
        --skip-manifest-update 2>&1 | tee /tmp/android-install.log || echo "?? Android workload installation failed - Android builds will be skipped"
    - echo ""
    - echo "Attempting to install wasm-tools workload..."
    - |
      dotnet workload install wasm-tools \
        --source https://api.nuget.org/v3/index.json \
        --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet10/nuget/v3/index.json \
        --skip-manifest-update || echo "?? WASM tools installation failed - Browser builds may be limited"
    - echo ""
    - echo "Final installed workloads:"
    - dotnet workload list || echo "No workloads successfully installed"
    - echo ""
    - echo "Checking for Android SDK availability..."
    - ls -la /usr/share/dotnet/packs/ 2>/dev/null || echo "No packs directory found"
  allow_failure: true

restore:
  stage: restore
  needs: ['setup-workloads']
  script:
    - echo "Restoring NuGet packages with .NET 10 feeds..."
    - ls -la ../NuGet.config || echo "NuGet.config not found, using default feeds"
    - dotnet restore $PROJECT_MODELS --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $PROJECT_INFRASTRUCTURE --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $PROJECT_DOMAIN --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $PROJECT_APPLICATION --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $PROJECT_WEB_API --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $PROJECT_DESKTOP --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $PROJECT_MOBILE --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - echo "Attempting Android project restore..."
    - dotnet restore $PROJECT_MOBILE_ANDROID --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config || echo "?? Android restore skipped"
    - dotnet restore $PROJECT_MOBILE_DESKTOP --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - echo "Restoring test projects..."
    - dotnet restore $TEST_API --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $TEST_INFRASTRUCTURE --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $TEST_DOMAIN --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $TEST_APPLICATION --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $TEST_DESKTOP --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $TEST_MOBILE_DESKTOP --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config
    - dotnet restore $TEST_MOBILE_ANDROID --packages ../$NUGET_PACKAGES_DIRECTORY --configfile ../NuGet.config || echo "?? Android test restore skipped"
  artifacts:
    paths:
      - $SOURCE_CODE_PATH*/$OBJECTS_DIRECTORY/
      - $SOURCE_CODE_PATH**/$OBJECTS_DIRECTORY/
    expire_in: 1 hour
  allow_failure: false

# ============================================================
# BUILD STAGE
# ============================================================

build:common:
  stage: build
  needs: ['restore']
  script:
    - dotnet build $PROJECT_MODELS --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - $SOURCE_CODE_PATH/Common/domain/bin/$CONFIGURATION/
    expire_in: 1 day

build:web-api:
  stage: build
  needs: ['restore', 'build:common']
  script:
    - dotnet build $PROJECT_WEB_API --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - $SOURCE_CODE_PATH/Web/api/bin/$CONFIGURATION/
    expire_in: 1 day

build:desktop:
  stage: build
  needs: ['restore', 'build:common']
  script:
    - dotnet build $PROJECT_DESKTOP --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - $SOURCE_CODE_PATH/Desktop/desktop/bin/$CONFIGURATION/
    expire_in: 1 day

build:mobile-core:
  stage: build
  needs: ['restore', 'build:common']
  script:
    - dotnet build $PROJECT_MOBILE --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - $SOURCE_CODE_PATH/Mobile/mobile/bin/$CONFIGURATION/
    expire_in: 1 day

build:mobile-android:
  stage: build
  needs: ['restore', 'build:mobile-core']
  script:
    - dotnet build $PROJECT_MOBILE_ANDROID --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - $SOURCE_CODE_PATH/Mobile/mobile.Android/bin/$CONFIGURATION/
    expire_in: 1 day
  allow_failure: true

build:mobile-desktop:
  stage: build
  needs: ['restore', 'build:mobile-core']
  script:
    - dotnet build $PROJECT_MOBILE_DESKTOP --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - $SOURCE_CODE_PATH/Mobile/mobile.Desktop/bin/$CONFIGURATION/
    expire_in: 1 day

build:infrastructure:
  stage: build
  needs: ['restore', 'build:common']
  script:
    - dotnet build $PROJECT_INFRASTRUCTURE --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - $SOURCE_CODE_PATH/Common/infrastructure/bin/$CONFIGURATION/
    expire_in: 1 day

build:application:
  stage: build
  needs: ['restore', 'build:common', 'build:infrastructure']
  script:
    - dotnet build $PROJECT_APPLICATION --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - $SOURCE_CODE_PATH/Common/application/bin/$CONFIGURATION/
    expire_in: 1 day

build:test-api:
  stage: build
  needs: ['restore', 'build:web-api']
  script:
    - dotnet build $TEST_API --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - ../Web/api.UnitTests/bin/$CONFIGURATION/
    expire_in: 1 day

build:test-infrastructure:
  stage: build
  needs: ['restore', 'build:infrastructure']
  script:
    - dotnet build $TEST_INFRASTRUCTURE --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - ../Common/infrastructure.UnitTests/bin/$CONFIGURATION/
    expire_in: 1 day

build:test-domain:
  stage: build
  needs: ['restore', 'build:common']
  script:
    - dotnet build $TEST_DOMAIN --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - ../Common/domain.UnitTests/bin/$CONFIGURATION/
    expire_in: 1 day

build:test-application:
  stage: build
  needs: ['restore', 'build:application']
  script:
    - dotnet build $TEST_APPLICATION --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - ../Common/application.UnitTests/bin/$CONFIGURATION/
    expire_in: 1 day

build:test-desktop:
  stage: build
  needs: ['restore', 'build:desktop']
  script:
    - dotnet build $TEST_DESKTOP --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - ../Desktop/desktop.UnitTests/bin/$CONFIGURATION/
    expire_in: 1 day

build:test-mobile-desktop:
  stage: build
  needs: ['restore', 'build:mobile-desktop']
  script:
    - dotnet build $TEST_MOBILE_DESKTOP --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - ../Mobile/mobile.Desktop.UnitTests/bin/$CONFIGURATION/
    expire_in: 1 day

build:test-mobile-android:
  stage: build
  needs: ['restore', 'build:mobile-android']
  script:
    - dotnet build $TEST_MOBILE_ANDROID --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - ../Mobile/mobile.Android.UnitTests/bin/$CONFIGURATION/
    expire_in: 1 day
  allow_failure: true

# ============================================================
# TEST STAGE
# ============================================================

test:api:
  stage: test
  needs: ['build:test-api']
  coverage: '/Total\s+\|\s+(\d+\.?\d*)%/'
  script:
    - echo "Running API unit tests..."
    - dotnet test $TEST_API --no-build --configuration $CONFIGURATION --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ../TestResults/API
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: '**/TestResults/API/**/coverage.cobertura.xml'
    paths:
      - '../TestResults/API/'
    expire_in: 30 days

test:infrastructure:
  stage: test
  needs: ['build:test-infrastructure']
  coverage: '/Total\s+\|\s+(\d+\.?\d*)%/'
  script:
    - echo "Running Infrastructure unit tests..."
    - dotnet test $TEST_INFRASTRUCTURE --no-build --configuration $CONFIGURATION --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ../TestResults/Infrastructure
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: '**/TestResults/Infrastructure/**/coverage.cobertura.xml'
    paths:
      - '../TestResults/Infrastructure/'
    expire_in: 30 days

test:domain:
  stage: test
  needs: ['build:test-domain']
  coverage: '/Total\s+\|\s+(\d+\.?\d*)%/'
  script:
    - echo "Running Domain unit tests..."
    - dotnet test $TEST_DOMAIN --no-build --configuration $CONFIGURATION --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ../TestResults/Domain
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: '**/TestResults/Domain/**/coverage.cobertura.xml'
    paths:
      - '../TestResults/Domain/'
    expire_in: 30 days

test:application:
  stage: test
  needs: ['build:test-application']
  coverage: '/Total\s+\|\s+(\d+\.?\d*)%/'
  script:
    - echo "Running Application unit tests..."
    - dotnet test $TEST_APPLICATION --no-build --configuration $CONFIGURATION --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ../TestResults/Application
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: '**/TestResults/Application/**/coverage.cobertura.xml'
    paths:
      - '../TestResults/Application/'
    expire_in: 30 days

test:desktop:
  stage: test
  needs: ['build:test-desktop']
  coverage: '/Total\s+\|\s+(\d+\.?\d*)%/'
  script:
    - echo "Running Desktop unit tests..."
    - dotnet test $TEST_DESKTOP --no-build --configuration $CONFIGURATION --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ../TestResults/Desktop
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: '**/TestResults/Desktop/**/coverage.cobertura.xml'
    paths:
      - '../TestResults/Desktop/'
    expire_in: 30 days

test:mobile-desktop:
  stage: test
  needs: ['build:test-mobile-desktop']
  coverage: '/Total\s+\|\s+(\d+\.?\d*)%/'
  script:
    - echo "Running Mobile Desktop unit tests..."
    - dotnet test $TEST_MOBILE_DESKTOP --no-build --configuration $CONFIGURATION --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ../TestResults/MobileDesktop
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: '**/TestResults/MobileDesktop/**/coverage.cobertura.xml'
    paths:
      - '../TestResults/MobileDesktop/'
    expire_in: 30 days

test:mobile-android:
  stage: test
  needs: ['build:test-mobile-android']
  coverage: '/Total\s+\|\s+(\d+\.?\d*)%/'
  script:
    - echo "Running Mobile Android unit tests..."
    - dotnet test $TEST_MOBILE_ANDROID --no-build --configuration $CONFIGURATION --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory ../TestResults/MobileAndroid
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: '**/TestResults/MobileAndroid/**/coverage.cobertura.xml'
    paths:
      - '../TestResults/MobileAndroid/'
    expire_in: 30 days
  allow_failure: true

# ============================================================
# ANALYZE STAGE
# ============================================================

code-quality:
  stage: analyze
  allow_failure: true
  script:
    - echo "Running code quality analysis..."
    - dotnet tool install --global dotnet-format || true
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet format --verify-no-changes --verbosity diagnostic || true
  artifacts:
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 7 days

security-scan:
  stage: analyze
  allow_failure: true
  script:
    - echo "Scanning for vulnerable dependencies..."
    - dotnet list package --vulnerable --include-transitive || true
  artifacts:
    when: always
    expire_in: 7 days

# ============================================================
# PACKAGE STAGE
# ============================================================

package:web-api:
  stage: package
  needs: ['build:web-api', 'test:api', 'test:infrastructure', 'test:domain', 'test:application']
  script:
    - echo "Publishing Web API..."
    - dotnet publish $PROJECT_WEB_API --no-restore --configuration $CONFIGURATION --output ../$ARTIFACTS_PATH/web-api
  artifacts:
    name: "web-api-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - $ARTIFACTS_PATH/web-api/
    expire_in: 30 days
  only:
    - main
    - master
    - develop
    - tags

package:android-apk:
  stage: package
  needs: ['build:mobile-android']
  script:
    - echo "Building Android APK..."
    - dotnet publish $PROJECT_MOBILE_ANDROID --no-restore --configuration $CONFIGURATION --framework net10.0-android --output ../$ARTIFACTS_PATH/android
  artifacts:
    name: "android-apk-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - $ARTIFACTS_PATH/android/*.apk
      - $ARTIFACTS_PATH/android/*.aab
    expire_in: 30 days
  only:
    - main
    - master
    - develop
    - tags
  allow_failure: true

package:desktop:
  stage: package
  needs: ['build:desktop']
  script:
    - echo "Publishing Desktop application..."
    - dotnet publish $PROJECT_DESKTOP --no-restore --configuration $CONFIGURATION --output ../$ARTIFACTS_PATH/desktop
  artifacts:
    name: "desktop-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - $ARTIFACTS_PATH/desktop/
    expire_in: 30 days
  only:
    - main
    - master
    - develop
    - tags

# ============================================================
# DEPLOY STAGE
# ============================================================

deploy:staging:
  stage: deploy
  needs: ['package:web-api']
  environment:
    name: staging
    url: https://staging.feuerwehr.example.com
  script:
    - echo "Deploying to staging environment..."
    - echo "API artifacts ready for deployment"
    - ls -la ../$ARTIFACTS_PATH/web-api/
    # Add your deployment script here (e.g., SSH, Docker, Kubernetes)
  only:
    - develop

deploy:production:
  stage: deploy
  needs: ['package:web-api']
  environment:
    name: production
    url: https://feuerwehr.example.com
  when: manual
  script:
    - echo "Deploying to production environment..."
    - echo "API artifacts ready for deployment"
    - ls -la ../$ARTIFACTS_PATH/web-api/
    # Add your production deployment script here
  only:
    - main
    - master
    - tags

# ============================================================
# DOCKER BUILDS (Optional - requires Docker-in-Docker)
# ============================================================

.docker-build:
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  tags:
    - docker

build:docker-api:
  extends: .docker-build
  stage: package
  needs: ['package:web-api']
  script:
    - echo "Building Docker image for Web API..."
    - cd $SOURCE_CODE_PATH
    - |
      docker build \
        -t $DOCKER_IMAGE_API:$CI_COMMIT_SHORT_SHA \
        -t $DOCKER_IMAGE_API:$CI_COMMIT_REF_SLUG \
        -t $DOCKER_IMAGE_API:latest \
        -f Web/api/Dockerfile \
        .
    - echo "Pushing images to registry..."
    - docker push $DOCKER_IMAGE_API:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE_API:$CI_COMMIT_REF_SLUG
    - docker push $DOCKER_IMAGE_API:latest
  only:
    - main
    - master
    - develop
    - tags
  when: manual

# -----------------------------
# GITLAB SECURITY SCANS
# -----------------------------
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml