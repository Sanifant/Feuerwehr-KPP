# GitLab CI/CD Pipeline for Feuerwehr Multi-Platform Application
# .NET 10 Target Framework

stages:
  - restore
  - build
  - test
  - analyze
  - package
  - deploy

image: mcr.microsoft.com/dotnet/sdk:10.0

variables:
  CONFIGURATION: 'Release'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  
  # Pfade angepasst: Muss innerhalb von $CI_PROJECT_DIR liegen
  SOURCE_CODE_PATH: 'src'
  NUGET_PACKAGES_DIRECTORY: '.nuget-cache'
  # Absoluter Pfad für die SDK-Tools
  NUGET_PACKAGES: "$CI_PROJECT_DIR/$NUGET_PACKAGES_DIRECTORY"
  
  ARTIFACTS_PATH: 'artifacts'

  # Project Paths (Relativ zu src/)
  PROJECT_MODELS: 'Common/domain/de.openelp.feuerwehr.domain.csproj'
  PROJECT_WEB_API: 'Web/api/de.openelp.feuerwehr.Api.csproj'
  PROJECT_DESKTOP: 'Desktop/desktop/de.openelp.feuerwehr.desktop.csproj'
  PROJECT_MOBILE: 'Mobile/mobile/de.openelp.feuerwehr.mobile.csproj'
  PROJECT_MOBILE_ANDROID: 'Mobile/mobile.Android/de.openelp.feuerwehr.mobile.Android.csproj'
  PROJECT_MOBILE_DESKTOP: 'Mobile/mobile.Desktop/de.openelp.feuerwehr.mobile.Desktop.csproj'
  PROJECT_INFRASTRUCTURE: 'Common/infrastructure/de.openelp.feuerwehr.infrastructure.csproj'
  PROJECT_DOMAIN: 'Common/domain/de.openelp.feuerwehr.domain.csproj'
  PROJECT_APPLICATION: 'Common/application/de.openelp.feuerwehr.application.csproj'

  # Test Project Paths
  TEST_API: '../Web/api.UnitTests/de.openelp.feuerwehr.Api.UnitTests.csproj'
  TEST_INFRASTRUCTURE: '../Common/infrastructure.UnitTests/de.openelp.feuerwehr.infrastructure.UnitTests.csproj'
  TEST_DOMAIN: '../Common/domain.UnitTests/de.openelp.feuerwehr.domain.UnitTests.csproj'
  TEST_APPLICATION: '../Common/application.UnitTests/de.openelp.feuerwehr.application.UnitTests.csproj'
  TEST_DESKTOP: '../Desktop/desktop.UnitTests/de.openelp.feuerwehr.desktop.UnitTests.csproj'
  TEST_MOBILE_DESKTOP: '../Mobile/mobile.Desktop.UnitTests/de.openelp.feuerwehr.mobile.Desktop.UnitTests.csproj'
  TEST_MOBILE_ANDROID: '../Mobile/mobile.Android.UnitTests/de.openelp.feuerwehr.mobile.Android.UnitTests.csproj'

  DOCKER_IMAGE_API: '$CI_REGISTRY_IMAGE/api'

# ### Global Cache Configuration
cache:
  key: "nuget-cache-$CI_COMMIT_REF_SLUG"
  paths:
    - '$NUGET_PACKAGES_DIRECTORY'
  policy: pull-push

# ### Global Setup Script
before_script:
  - export NUGET_PACKAGES="$CI_PROJECT_DIR/$NUGET_PACKAGES_DIRECTORY"
  - cd $SOURCE_CODE_PATH
  - echo "Pipeline running for branch $CI_COMMIT_REF_NAME"

# ============================================================
# RESTORE STAGE
# ============================================================

setup-workloads:
  stage: restore
  script:
    - dotnet workload install android wasm-tools --source https://api.nuget.org/v3/index.json --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet10/nuget/v3/index.json || echo "Workload install partially failed"
  allow_failure: true

restore:
  stage: restore
  needs: ['setup-workloads']
  script:
    - echo "Restoring NuGet packages to $NUGET_PACKAGES"
    # Wir führen den Restore zentral aus. --packages sorgt für den richtigen Zielort.
    - dotnet restore $PROJECT_DESKTOP --packages $NUGET_PACKAGES
    - dotnet restore $PROJECT_WEB_API --packages $NUGET_PACKAGES
    - dotnet restore $PROJECT_MODELS --packages $NUGET_PACKAGES
    - dotnet restore $PROJECT_INFRASTRUCTURE --packages $NUGET_PACKAGES
    - dotnet restore $PROJECT_APPLICATION --packages $NUGET_PACKAGES
    - dotnet restore $PROJECT_MOBILE --packages $NUGET_PACKAGES
    - dotnet restore $PROJECT_MOBILE_DESKTOP --packages $NUGET_PACKAGES
    # Tests
    - dotnet restore $TEST_API --packages $NUGET_PACKAGES
    - dotnet restore $TEST_DESKTOP --packages $NUGET_PACKAGES
  artifacts:
    paths:
      - "**/obj/project.assets.json"
      - "**/obj/*.nuget.g.*"
      - "$NUGET_PACKAGES_DIRECTORY/"
    expire_in: 1 hour

# ============================================================
# BUILD STAGE
# ============================================================

build:common:
  stage: build
  needs: ['restore']
  script:
    - dotnet build $PROJECT_MODELS --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - "**/bin/$CONFIGURATION/"
    expire_in: 1 day

build:desktop:
  stage: build
  needs: ['restore', 'build:common']
  script:
    # Hier wird Avalonia nun im .nuget-cache gefunden
    - dotnet build $PROJECT_DESKTOP --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - "**/Desktop/desktop/bin/$CONFIGURATION/"
    expire_in: 1 day

build:web-api:
  stage: build
  needs: ['restore', 'build:common']
  script:
    - dotnet build $PROJECT_WEB_API --no-restore --configuration $CONFIGURATION
  artifacts:
    paths:
      - "**/Web/api/bin/$CONFIGURATION/"
    expire_in: 1 day

# ... (Andere Build-Jobs analog weiterführen)

# ============================================================
# TEST STAGE
# ============================================================

test:desktop:
  stage: test
  needs: ['build:desktop']
  script:
    - dotnet test $TEST_DESKTOP --no-build --configuration $CONFIGURATION --results-directory ../TestResults/Desktop
  artifacts:
    when: always
    paths:
      - '../TestResults/'
    expire_in: 30 days

# ============================================================
# PACKAGE STAGE
# ============================================================

package:desktop:
  stage: package
  needs: ['build:desktop']
  script:
    - dotnet publish $PROJECT_DESKTOP --no-restore --configuration $CONFIGURATION --output ../$ARTIFACTS_PATH/desktop
  artifacts:
    paths:
      - $ARTIFACTS_PATH/desktop/
    expire_in: 30 days
  only:
    - main
    - develop

# (Rest der Security Scans und Deployments bleibt wie gehabt)
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml