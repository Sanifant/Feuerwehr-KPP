# Add this inside your 'http' block (outside the 'server' block) to map allowed origins
map $http_origin $allow_cors_origin {
	default "";
	"https://integration.ff-kleinparin-pohnsdorf.de"	"$http_origin";
	"https://inventar.ff-kleinparin-pohnsdorf.de"		"$http_origin";
	"capacitor://localhost"								"$http_origin"; # Ionic/Capacitor iOS
	"http://localhost"									"$http_origin"; # Ionic/Capacitor Android
}

server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Serve static assets with long-term caching
	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# SPA fallback: all other routes serve index.html
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Proxy API calls to backend service
	location /api/ {
		# If the origin isn't in our allowed map, Nginx sends an empty string, blocking the CORS request
		add_header 'Access-Control-Allow-Origin' $allow_cors_origin always;
		add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
		add_header 'Access-Control-Allow-Headers' 'User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
		add_header 'Access-Control-Allow-Credentials' 'true' always;

		if ($request_method = 'OPTIONS') {
			add_header 'Access-Control-Allow-Origin' $allow_cors_origin always;
			add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
			add_header 'Access-Control-Allow-Headers' 'User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
			add_header 'Access-Control-Allow-Credentials' 'true' always;
			add_header 'Access-Control-Max-Age' 1728000;
			add_header 'Content-Type' 'text/plain; charset=utf-8';
			add_header 'Content-Length' 0;
			return 204;
		}

		proxy_pass http://${UPSTREAM_HOST}:${UPSTREAM_PORT};
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
	}

	# Health check endpoint
	location /health {
		access_log off;
		add_header Content-Type text/plain;
		return 200 "OK\n";
	}

	
	# Deny access to .files
	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
	}
}
