  upload-release-assets:
    name: Upload release assets
    needs:
      - publish-api-image
      - publish-frontend-image
      - build-desktop-bundles
      - build-android-bundle
      # - build-ios-bundle
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ./release-assets
          pattern: release-*
          merge-multiple: true
      - name: Upload bundles to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ./release-assets/**
          fail_on_unmatched_files: false

  deploy-production:
    name: Deploy production environment
    needs: [publish-api-image, publish-frontend-image, upload-release-assets]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger production deployment
        shell: bash
        env:
          PORTAINER_WEBHOOK_URL_PRODUCTION: ${{ secrets.PORTAINER_WEBHOOK_URL_PRODUCTION }}
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          URL="${PORTAINER_WEBHOOK_URL_PRODUCTION:-$PORTAINER_WEBHOOK_URL}"
          if [ -z "$URL" ]; then
            echo "No production webhook secret configured." >&2
            exit 1
          fi
          curl -fsSL -X POST "$URL"

  publish-gitbook-docs:
    name: Publish documentation to GitBook
    needs: [backend-build-and-test, frontend-build-and-test, integration-tests]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Publish documentation
        env:
          GITBOOK_TOKEN: ${{ secrets.GITBOOK_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
        run: python3 scripts/publish_gitbook_docs.py
