name: Pipeline - CI/CD

on:
  push:
    # Include every master merge, even when only files outside src change.
    branches: ['**']
  pull_request:
    branches: ['**']
    paths:
      - 'src/**'
      - '.github/workflows/ci.yml'
  release:
    types: [published]
  workflow_dispatch:

    
permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.12.0'
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/feuerwehr-api
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/feuerwehr-frontend

jobs:
  backend-build-and-test:
    name: Backend build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore backend and app tests
        id: restore-tests
        run: |
          dotnet restore src/Backend/Tests.Feuerwehr.Backend/Tests.Feuerwehr.Backend.csproj
          dotnet restore src/App/Feuerwehr.App/Tests.Feuerwehr.App/Tests.Feuerwehr.App.csproj
      - name: Build backend server
        run: dotnet build src/Backend/Feuerwehr.Server/Feuerwehr.Server.csproj -c Release --no-restore
      - name: Run backend tests
        run: dotnet test src/Backend/Tests.Feuerwehr.Backend/Tests.Feuerwehr.Backend.csproj -c Release --no-restore --logger "trx;LogFileName=backend-tests.trx" --results-directory ./TestResults/backend
      - name: Run app tests
        if: ${{ !cancelled() && steps.restore-tests.outcome == 'success' }}
        run: dotnet test src/App/Feuerwehr.App/Tests.Feuerwehr.App/Tests.Feuerwehr.App.csproj -c Release --no-restore --logger "trx;LogFileName=app-tests.trx" --results-directory ./TestResults/app
      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-test-results
          path: TestResults/**/*.trx

  frontend-build-and-test:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        id: install-frontend
        working-directory: src/frontend
        run: npm ci --ignore-scripts
      - name: Build frontend
        working-directory: src/frontend
        run: npm run build
      - name: Run frontend tests
        if: ${{ !cancelled() && steps.install-frontend.outcome == 'success' }}
        working-directory: src/frontend
        run: npm run test:ci
      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-test-results
          path: src/frontend/TestResults/vitest-junit.xml

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore desktop project
        run: dotnet restore src/App/Feuerwehr.App/Feuerwehr.App.Desktop/Feuerwehr.App.Desktop.csproj
      - name: Build desktop project
        run: dotnet build src/App/Feuerwehr.App/Feuerwehr.App.Desktop/Feuerwehr.App.Desktop.csproj -c Release --no-restore

  integration-tests:
    name: API integration tests (Testcontainers)
    needs: [backend-build-and-test]
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Check Docker
        run: docker info
      - name: Restore integration tests
        run: dotnet restore src/Backend/Tests.Feuerwehr.Backend.Integration/Tests.Feuerwehr.Backend.Integration.csproj
      - name: Build integration tests
        run: dotnet build src/Backend/Tests.Feuerwehr.Backend.Integration/Tests.Feuerwehr.Backend.Integration.csproj -c Release --no-restore
      - name: Run integration tests
        run: dotnet test src/Backend/Tests.Feuerwehr.Backend.Integration/Tests.Feuerwehr.Backend.Integration.csproj -c Release --no-build --logger "trx;LogFileName=integration-tests.trx" --results-directory ./TestResults/integration
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: TestResults/integration/*.trx

  test-summary:
    name: Test summary
    needs: [backend-build-and-test, frontend-build-and-test, integration-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify summary renderer
        run: python3 -m unittest discover -s src/ci -p 'test_*.py'
      - name: Download all test results
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*test-results'
          path: ./test-results
      - name: Write test summary
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 src/ci/summarize_tests.py ./test-results

  publish-api-image:
    name: Publish API image
    needs: [backend-build-and-test, frontend-build-and-test, integration-tests]
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=sha
            type=raw,value=integration,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src
          file: ./src/Backend/Feuerwehr.Server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false

  publish-frontend-image:
    name: Publish frontend image
    needs: [backend-build-and-test, frontend-build-and-test, integration-tests]
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=sha
            type=raw,value=integration,enable=${{ github.event_name != 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false

  deploy-integration:
    name: Deploy integration environment
    needs: [publish-api-image, publish-frontend-image]
    if: github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions: {}
    environment: integration
    steps:
      - name: Trigger integration deployment
        shell: bash
        env:
          PORTAINER_WEBHOOK_URL_INTEGRATION: ${{ secrets.PORTAINER_WEBHOOK_URL_INTEGRATION }}
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          URL="${PORTAINER_WEBHOOK_URL_INTEGRATION:-$PORTAINER_WEBHOOK_URL}"
          if [ -z "$URL" ]; then
            echo "No integration webhook secret configured." >&2
            exit 1
          fi
          curl -fsSL -X POST "$URL"

  build-desktop-bundles:
    name: Build desktop bundle (${{ matrix.runtime }})
    needs: [backend-build-and-test, frontend-build-and-test, integration-tests]
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore desktop project
        run: dotnet restore src/App/Feuerwehr.App/Feuerwehr.App.Desktop/Feuerwehr.App.Desktop.csproj
      - name: Publish desktop bundle
        run: dotnet publish src/App/Feuerwehr.App/Feuerwehr.App.Desktop/Feuerwehr.App.Desktop.csproj -c Release -r ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -o ./artifacts/desktop-${{ matrix.runtime }}
      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-desktop-${{ matrix.runtime }}
          path: ./artifacts/desktop-${{ matrix.runtime }}/**

  build-android-bundle:
    name: Build and deploy Android bundles
    needs: [backend-build-and-test, frontend-build-and-test, integration-tests]
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: windows-latest
    # Serialize Play edits across internal and production uploads.
    concurrency:
      group: google-play-de-openelp-feuerwehr
      cancel-in-progress: false
    env:
      # Increase this repository variable if migrating from a higher Play versionCode.
      ANDROID_VERSION_CODE_BASE: ${{ vars.ANDROID_VERSION_CODE_BASE || '0' }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PLAY_TRACK: ${{ github.event_name == 'release' && 'production' || 'internal' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set Android version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [long]$versionBase = 0
          if (-not [long]::TryParse($env:ANDROID_VERSION_CODE_BASE, [ref]$versionBase) -or $versionBase -lt 0) {
            throw 'ANDROID_VERSION_CODE_BASE must be a non-negative integer.'
          }
          # Reserve two digits for reruns so retrying an upload gets a fresh versionCode.
          [long]$runNumber = $env:GITHUB_RUN_NUMBER
          [long]$attempt = $env:GITHUB_RUN_ATTEMPT
          if ($runNumber -lt 1 -or $attempt -lt 1 -or $attempt -gt 99) {
            throw 'Invalid workflow run number or attempt (supported attempts: 1-99).'
          }
          [long]$versionCode = $versionBase + ($runNumber * 100) + $attempt
          if ($versionCode -gt 2100000000 -or $versionCode -lt 1) {
            throw 'Android versionCode must be between 1 and 2100000000.'
          }
          $versionName = "0.0.$runNumber-ci.$attempt"
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $versionName = $env:RELEASE_TAG -replace '^v', ''
          }
          if ($versionName -notmatch '^[0-9A-Za-z][0-9A-Za-z.+_-]{0,49}$') {
            throw 'Invalid Android display version.'
          }
          "ANDROID_VERSION_CODE=$versionCode" >> $env:GITHUB_ENV
          "ANDROID_VERSION_NAME=$versionName" >> $env:GITHUB_ENV
          Write-Host "Android $versionName ($versionCode) -> $env:PLAY_TRACK"
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Prepare and validate Android signing
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required GitHub secret: $name"
            }
          }
          try {
            $keystoreBytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64.Trim())
          } catch {
            throw 'ANDROID_KEYSTORE_BASE64 must contain a Base64-encoded keystore.'
          }
          # Preserve support for the double-encoded secret accepted by the old CD.
          $possibleBase64 = [Text.Encoding]::ASCII.GetString($keystoreBytes) -replace '\s', ''
          if ($possibleBase64.Length -gt 0 -and $possibleBase64.Length % 4 -eq 0 -and $possibleBase64 -match '^[A-Za-z0-9+/]+={0,2}$') {
            $keystoreBytes = [Convert]::FromBase64String($possibleBase64)
          }
          $keystorePath = Join-Path $env:RUNNER_TEMP 'android-release.keystore'
          $storePasswordPath = Join-Path $env:RUNNER_TEMP 'android-store-password.txt'
          $keyPasswordPath = Join-Path $env:RUNNER_TEMP 'android-key-password.txt'
          [IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($storePasswordPath, $env:ANDROID_KEYSTORE_PASSWORD, $utf8)
          [IO.File]::WriteAllText($keyPasswordPath, $env:ANDROID_KEY_PASSWORD, $utf8)
          & keytool -list -keystore $keystorePath -alias $env:ANDROID_KEY_ALIAS '-storepass:env' ANDROID_KEYSTORE_PASSWORD *> $null
          if ($LASTEXITCODE -ne 0) {
            throw 'Keystore validation failed. Check the keystore, store password and key alias secrets.'
          }
          "ANDROID_KEYSTORE_PATH=$keystorePath" >> $env:GITHUB_ENV
          "ANDROID_STORE_PASSWORD_PATH=$storePasswordPath" >> $env:GITHUB_ENV
          "ANDROID_KEY_PASSWORD_PATH=$keyPasswordPath" >> $env:GITHUB_ENV
      - name: Install Android workload
        run: dotnet workload install android --source https://api.nuget.org/v3/index.json
      - name: Install Android SDK dependencies
        run: dotnet build src/App/Feuerwehr.App/Feuerwehr.App.Android/Feuerwehr.App.Android.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AcceptAndroidSdkLicenses=True
      - name: Publish signed Android AAB and APK
        shell: pwsh
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($format in @('aab', 'apk')) {
            dotnet publish src/App/Feuerwehr.App/Feuerwehr.App.Android/Feuerwehr.App.Android.csproj `
              -c Release -f net10.0-android `
              "-p:ApplicationId=de.openelp.feuerwehr" `
              "-p:ApplicationVersion=$env:ANDROID_VERSION_CODE" `
              "-p:ApplicationDisplayVersion=$env:ANDROID_VERSION_NAME" `
              "-p:AndroidPackageFormat=$format" "-p:AndroidPackageFormats=$format" `
              -p:AndroidKeyStore=true `
              "-p:AndroidSigningKeyStore=$env:ANDROID_KEYSTORE_PATH" `
              "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS" `
              "-p:AndroidSigningStorePass=file:$env:ANDROID_STORE_PASSWORD_PATH" `
              "-p:AndroidSigningKeyPass=file:$env:ANDROID_KEY_PASSWORD_PATH" `
              -o "./artifacts/android/$format"
            if ($LASTEXITCODE -ne 0) { throw "Android $format publish failed." }
          }
      - name: Verify signed Android bundle
        id: android-bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundles = @(Get-ChildItem ./artifacts/android/aab -Recurse -Filter '*-Signed.aab')
          if ($bundles.Count -ne 1) { throw 'Expected exactly one signed Android App Bundle.' }
          $verification = & jarsigner '-J-Duser.language=en' '-J-Duser.country=US' -verify $bundles[0].FullName | Out-String
          if ($LASTEXITCODE -ne 0 -or $verification -notmatch 'jar verified\.') {
            throw 'Android App Bundle signature verification failed or the bundle is unsigned.'
          }
          Write-Host $verification
          "path=$($bundles[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: |
            ./artifacts/android/aab/**/*-Signed.aab
            ./artifacts/android/apk/**/*-Signed.apk
          if-no-files-found: error
      - name: Upload Android bundle to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.openelp.feuerwehr
          releaseFiles: ${{ steps.android-bundle.outputs.path }}
          track: ${{ env.PLAY_TRACK }}
          status: completed
      - name: Remove Android signing material
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('android-release.keystore', 'android-store-password.txt', 'android-key-password.txt')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
          }


