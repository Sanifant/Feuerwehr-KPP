name: CI - Build and Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master, develop]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'src/de.openelp.feuerwehr.slnx'

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: install android workload
      run: >
        dotnet workload install android --skip-manifest-update
        --source https://api.nuget.org/v3/index.json
        --source https://aka.ms/dotnet9/nuget/index.json

    - name: install ios workload
      run: >
        dotnet workload install ios --skip-manifest-update
        --source https://api.nuget.org/v3/index.json
        --source https://aka.ms/dotnet9/nuget/index.json
        
    - name: install wasm-tools workload
      run: >
        dotnet workload install wasm-tools --skip-manifest-update
        --source https://api.nuget.org/v3/index.json
        --source https://aka.ms/dotnet9/nuget/index.json
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test ${{ env.SOLUTION_FILE }} --configuration Release --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/*.trx'
        
    - name: Upload code coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: '**/coverage.cobertura.xml'
