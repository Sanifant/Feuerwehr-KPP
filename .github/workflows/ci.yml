name: CI - Build and Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master, develop]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  web-linux:
    name: Web (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          dotnet restore src/Web/api/de.openelp.feuerwehr.Api.csproj
          dotnet restore src/Tests/Web/api.UnitTests/de.openelp.feuerwehr.Api.UnitTests.csproj

      - name: Build
        run: |
          dotnet build src/Web/api/de.openelp.feuerwehr.Api.csproj -c Release --no-restore

      - name: Test
        run: |
          dotnet test src/Tests/Web/api.UnitTests/de.openelp.feuerwehr.Api.UnitTests.csproj -c Release --no-build --verbosity normal --coverage --report-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-web-linux
          path: '**/*.trx'

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-web-linux
          path: '**/coverage.cobertura.xml'

