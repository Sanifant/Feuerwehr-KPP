name: CD - Deploy

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [develop, master]
  release:
    types: [published]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'src/Feuerwehr.slnx'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/feuerwehr-api
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/feuerwehr-frontend

jobs:
  publish-container:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      
    - name: Log in to Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=integration,enable=${{ (github.event.workflow_run.head_branch || github.ref_name) == 'master' }}
          type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
      with:
        context: ./src
        file: ./src/Backend/Feuerwehr.Server/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        provenance: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  publish-frontend:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

    - name: Log in to Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=integration,enable=${{ (github.event.workflow_run.head_branch || github.ref_name) == 'master' }}
          type=raw,value=latest,enable=${{ github.event_name == 'release' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
      with:
        context: ./src/frontend
        file: ./src/frontend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        provenance: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  publish-desktop:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Publish Desktop App (Windows x64)
      run: dotnet publish src\App\Feuerwehr.App\Feuerwehr.App.Desktop\Feuerwehr.App.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./publish/desktop-win-x64
      
    - name: Publish Desktop App (Windows ARM64)
      run: dotnet publish src\App\Feuerwehr.App\Feuerwehr.App.Desktop\Feuerwehr.App.Desktop.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./publish/desktop-win-arm64
      
    - name: Upload Desktop App Artifacts (Windows x64)
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: desktop-app-win-x64
        path: ./publish/desktop-win-x64/
        
    - name: Upload Desktop App Artifacts (Windows ARM64)
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: desktop-app-win-arm64
        path: ./publish/desktop-win-arm64/

  publish-android:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Java JDK
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: 'microsoft'
        java-version: '17'
        
    - name: Install Android workload
      shell: pwsh
      run: |
        dotnet workload install android --skip-manifest-update `
          --source https://api.nuget.org/v3/index.json `
          --source https://aka.ms/dotnet9/nuget/index.json
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Decode Keystore
      if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
          throw "ANDROID_KEYSTORE_BASE64 is not configured."
        }
        $keystorePath = Join-Path $env:RUNNER_TEMP 'android-release.keystore'
        try {
          $keystoreBytes = [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64.Trim())
        } catch {
          throw "ANDROID_KEYSTORE_BASE64 is not valid base64 (store the raw keystore file encoded as a single base64 string)."
        }
        $nestedBase64 = [System.Text.Encoding]::ASCII.GetString($keystoreBytes) -replace '\s', ''
        if ($nestedBase64.Length -gt 0 -and $nestedBase64.Length % 4 -eq 0 -and $nestedBase64 -match '\A(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?\z') {
          $keystoreBytes = [System.Convert]::FromBase64String($nestedBase64)
          Write-Host "Decoded an additional base64 layer from ANDROID_KEYSTORE_BASE64."
        }
        [System.IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)
        "ANDROID_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Validate Android signing configuration
      if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: |
        foreach ($name in 'ANDROID_SIGNING_KEY_ALIAS','ANDROID_SIGNING_KEY_PASSWORD','ANDROID_KEYSTORE_PASSWORD') {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            $secret = @{ ANDROID_SIGNING_KEY_ALIAS='ANDROID_KEY_ALIAS'; ANDROID_SIGNING_KEY_PASSWORD='ANDROID_KEY_PASSWORD'; ANDROID_KEYSTORE_PASSWORD='ANDROID_KEYSTORE_PASSWORD' }[$name]
            throw "Secret $secret is not configured."
          }
        }
        if (-not (Test-Path -LiteralPath $env:ANDROID_KEYSTORE_PATH -PathType Leaf)) {
          throw "Keystore file not found at '$env:ANDROID_KEYSTORE_PATH'."
        }
        Write-Host "Keystore size: $((Get-Item -LiteralPath $env:ANDROID_KEYSTORE_PATH).Length) bytes"
        keytool -list -keystore "$env:ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD
        if ($LASTEXITCODE -ne 0) {
          throw "keytool could not open the keystore. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
        }
        keytool -list -keystore "$env:ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$env:ANDROID_SIGNING_KEY_ALIAS" | Out-Null
        if ($LASTEXITCODE -ne 0) {
          throw "Alias '$env:ANDROID_SIGNING_KEY_ALIAS' not found in keystore. Check secret ANDROID_KEY_ALIAS."
        }

    - name: Build Android App (Debug)
      if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
      run: dotnet build src\App\Feuerwehr.App\Feuerwehr.App.Android\Feuerwehr.App.Android.csproj -c Debug -f net10.0-android
      
    - name: Build Android App (Release - Signed)
      if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      env:
        ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      shell: pwsh
      run: |
        dotnet publish src\App\Feuerwehr.App\Feuerwehr.App.Android\Feuerwehr.App.Android.csproj `
          -c Release `
          -f net10.0-android `
          -p:AndroidKeyStore=true `
          -p:AndroidSigningKeyStore="$env:ANDROID_KEYSTORE_PATH" `
          -p:AndroidSigningKeyAlias="$env:ANDROID_SIGNING_KEY_ALIAS" `
          -p:AndroidSigningKeyPass="$env:ANDROID_SIGNING_KEY_PASSWORD" `
          -p:AndroidSigningStorePass="$env:ANDROID_KEYSTORE_PASSWORD" `
          -o ./publish/android
        if ($LASTEXITCODE -ne 0) { throw "Android publish/signing failed (exit code $LASTEXITCODE)." }
      
    - name: Upload Android App Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: android-app
        path: ./publish/android/*.apk
        if-no-files-found: warn
        
    - name: Upload to Google Play Store (Internal Testing)
      if: github.ref == 'refs/heads/main'
      uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: de.openelp.feuerwehr.mobile
        releaseFiles: ./publish/android/*.aab
        track: internal
        status: completed
        
    - name: Upload to Google Play Store (Production)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: de.openelp.feuerwehr.mobile
        releaseFiles: ./publish/android/*.aab
        track: production
        status: completed

  deploy_integration:
    needs: [publish-container, publish-frontend]
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: integration
    steps:
      - name: Deploy via Portainer webhook (integration)
        run: curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

  concurrency:
    needs: publish-container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via Portainer webhook (production)
        run: curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
      # (optional) repeat verify steps here, but likely with different stack id / endpoint id
