name: CD - Deploy

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types: [completed]
    branches: [develop, master]
  release:
    types: [published]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'src/Feuerwehr.slnx'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/feuerwehr-api
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/feuerwehr-frontend

jobs:
  publish-container:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=integration,enable=${{ github.ref == 'refs/heads/develop' }}
          type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./src
        file: ./src/Backend/Feuerwehr.Server/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        provenance: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  publish-frontend:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=integration,enable=${{ github.ref == 'refs/heads/develop' }}
          type=raw,value=latest,enable=${{ github.event_name == 'release' }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./src/frontend
        file: ./src/frontend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        provenance: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

  publish-desktop:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Publish Desktop App (Windows x64)
      run: dotnet publish src\App\Feuerwehr.App\Feuerwehr.App.Desktop\Feuerwehr.App.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./publish/desktop-win-x64
      
    - name: Publish Desktop App (Windows ARM64)
      run: dotnet publish src\App\Feuerwehr.App\Feuerwehr.App.Desktop\Feuerwehr.App.Desktop.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./publish/desktop-win-arm64
      
    - name: Upload Desktop App Artifacts (Windows x64)
      uses: actions/upload-artifact@v4
      with:
        name: desktop-app-win-x64
        path: ./publish/desktop-win-x64/
        
    - name: Upload Desktop App Artifacts (Windows ARM64)
      uses: actions/upload-artifact@v4
      with:
        name: desktop-app-win-arm64
        path: ./publish/desktop-win-arm64/

  publish-android:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'
        
    - name: Install Android workload
      run: |
        dotnet workload install android --skip-manifest-update --source https://api.nuget.org/v3/index.json --source https://aka.ms/dotnet9/nuget/index.json
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Decode Keystore
      if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      run: |
        $keystore_bytes = [System.Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
        [System.IO.File]::WriteAllBytes("${{ github.workspace }}/keystore.jks", $keystore_bytes)
      
    - name: Build Android App (Debug)
      if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
      run: dotnet build src\App\Feuerwehr.App\Feuerwehr.App.Android\Feuerwehr.App.Android.csproj -c Debug -f net10.0-android
      
    - name: Build Android App (Release - Signed)
      if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      run: |
        dotnet publish src\App\Feuerwehr.App\Feuerwehr.App.Android\Feuerwehr.App.Android.csproj `
          -c Release `
          -f net10.0-android `
          -p:AndroidKeyStore=true `
          -p:AndroidSigningKeyStore="${{ github.workspace }}/keystore.jks" `
          -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
          -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
          -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
          -o ./publish/android
      
    - name: Upload Android App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: ./publish/android/*.apk
        if-no-files-found: warn
        
    - name: Upload to Google Play Store (Internal Testing)
      if: github.ref == 'refs/heads/main'
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: de.openelp.feuerwehr.mobile
        releaseFiles: ./publish/android/*.aab
        track: internal
        status: completed
        
    - name: Upload to Google Play Store (Production)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: de.openelp.feuerwehr.mobile
        releaseFiles: ./publish/android/*.aab
        track: production
        status: completed

  deploy_integration:
    needs: [publish-container, publish-frontend]
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop') || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: integration
    steps:
      - name: Deploy via Portainer webhook (integration)
        run: curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

  concurrency:
    needs: publish-container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via Portainer webhook (production)
        run: curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
      # (optional) repeat verify steps here, but likely with different stack id / endpoint id