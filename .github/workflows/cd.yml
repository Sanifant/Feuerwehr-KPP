name: CD - Deploy

on:
  push:
    branches: [develop, main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'src/Feuerwehr.slnx'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/feuerwehr-api

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./src/Web/api
        file: ./src/Web/api/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  publish-desktop:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Publish Desktop App (Windows x64)
      run: dotnet publish src/Desktop/desktop/de.openelp.feuerwehr.desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./publish/desktop-win-x64
      
    - name: Publish Desktop App (Windows ARM64)
      run: dotnet publish src/Desktop/desktop/de.openelp.feuerwehr.desktop.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./publish/desktop-win-arm64
      
    - name: Upload Desktop App Artifacts (Windows x64)
      uses: actions/upload-artifact@v4
      with:
        name: desktop-app-win-x64
        path: ./publish/desktop-win-x64/
        
    - name: Upload Desktop App Artifacts (Windows ARM64)
      uses: actions/upload-artifact@v4
      with:
        name: desktop-app-win-arm64
        path: ./publish/desktop-win-arm64/

  publish-android:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Decode Keystore
      if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      run: |
        $keystore_bytes = [System.Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
        [System.IO.File]::WriteAllBytes("${{ github.workspace }}/keystore.jks", $keystore_bytes)
      
    - name: Build Android App (Debug)
      if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
      run: dotnet build src/Mobile/mobile.Android/de.openelp.feuerwehr.mobile.Android.csproj -c Debug -f net10.0-android
      
    - name: Build Android App (Release - Signed)
      if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      run: |
        dotnet publish src/Mobile/mobile.Android/de.openelp.feuerwehr.mobile.Android.csproj `
          -c Release `
          -f net10.0-android `
          -p:AndroidKeyStore=true `
          -p:AndroidSigningKeyStore="${{ github.workspace }}/keystore.jks" `
          -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
          -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
          -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
          -o ./publish/android
      
    - name: Upload Android App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: ./publish/android/*.apk
        if-no-files-found: warn
        
    - name: Upload to Google Play Store (Internal Testing)
      if: github.ref == 'refs/heads/main'
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: de.openelp.feuerwehr.mobile
        releaseFiles: ./publish/android/*.aab
        track: internal
        status: completed
        
    - name: Upload to Google Play Store (Production)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: de.openelp.feuerwehr.mobile
        releaseFiles: ./publish/android/*.aab
        track: production
        status: completed

  deploy_integration:
    needs: publish-container
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: integration
    steps:
      - name: Deploy via Portainer webhook (integration)
        run: curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"

      - name: Portainer API login (verify only)
        id: portainer
        shell: bash
        run: |
          set -euo pipefail
          JWT=$(curl -fsSL -X POST "${{ secrets.PORTAINER_URL }}/api/auth" \
            -H "Content-Type: application/json" \
            -d '{"Username":"${{ secrets.PORTAINER_USER }}","Password":"${{ secrets.PORTAINER_PASS }}"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['jwt'])")
          echo "jwt=$JWT" >> "$GITHUB_OUTPUT"

      - name: Verify stack reachable
        shell: bash
        env:
          JWT: ${{ steps.portainer.outputs.jwt }}
        run: |
          set -euo pipefail
          curl -fsSL "${{ secrets.PORTAINER_URL }}/api/stacks/${{ vars.PORTAINER_STACK_ID }}" \
            -H "Authorization: Bearer ${JWT}" \
            | python3 -c "import sys,json; s=json.load(sys.stdin); print('OK stack:', s.get('Id'), s.get('Name'), 'endpoint:', s.get('EndpointId'))"

      - name: Verify container running (feuerwehr_api)
        shell: bash
        env:
          JWT: ${{ steps.portainer.outputs.jwt }}
          ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          CONTAINER_NAME: feuerwehr_api
        run: |
          set -euo pipefail
          curl -fsSL \
            "${{ secrets.PORTAINER_URL }}/api/endpoints/${ENDPOINT_ID}/docker/containers/json?all=1" \
            -H "Authorization: Bearer ${JWT}" \
            | python3 - <<'PY'
            import sys, json, os
            containers = json.load(sys.stdin)
            name = os.environ["CONTAINER_NAME"]
            hits = [c for c in containers if any(n.lstrip("/") == name for n in c.get("Names", []))]
            if not hits:
                raise SystemExit(f"Container '{name}' not found")
            c = hits[0]
            print("Container:", c["Id"][:12], "image:", c.get("Image"), "state:", c.get("State"), "status:", c.get("Status"))
            if c.get("State") != "running":
                raise SystemExit("Container not running")
            PY

  concurrency:
    needs: publish-container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via Portainer webhook (production)
        run: curl -fsSL -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
      # (optional) repeat verify steps here, but likely with different stack id / endpoint id