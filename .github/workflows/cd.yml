name: CD - Deploy

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_FILE: 'src/de.openelp.feuerwehr.slnx'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/feuerwehr-api

jobs:
  publish-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./src/Web/api
        file: ./src/Web/api/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  publish-desktop:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Publish Desktop App (Windows x64)
      run: dotnet publish src/Desktop/desktop/de.openelp.feuerwehr.desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./publish/desktop-win-x64
      
    - name: Publish Desktop App (Windows ARM64)
      run: dotnet publish src/Desktop/desktop/de.openelp.feuerwehr.desktop.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -o ./publish/desktop-win-arm64
      
    - name: Upload Desktop App Artifacts (Windows x64)
      uses: actions/upload-artifact@v4
      with:
        name: desktop-app-win-x64
        path: ./publish/desktop-win-x64/
        
    - name: Upload Desktop App Artifacts (Windows ARM64)
      uses: actions/upload-artifact@v4
      with:
        name: desktop-app-win-arm64
        path: ./publish/desktop-win-arm64/

  publish-android:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_FILE }}
      
    - name: Decode Keystore
      if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      run: |
        $keystore_bytes = [System.Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
        [System.IO.File]::WriteAllBytes("${{ github.workspace }}/keystore.jks", $keystore_bytes)
      
    - name: Build Android App (Debug)
      if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
      run: dotnet build src/Mobile/mobile.Android/de.openelp.feuerwehr.mobile.Android.csproj -c Debug -f net10.0-android
      
    - name: Build Android App (Release - Signed)
      if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      run: |
        dotnet publish src/Mobile/mobile.Android/de.openelp.feuerwehr.mobile.Android.csproj `
          -c Release `
          -f net10.0-android `
          -p:AndroidKeyStore=true `
          -p:AndroidSigningKeyStore="${{ github.workspace }}/keystore.jks" `
          -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" `
          -p:AndroidSigningKeyPass="${{ secrets.ANDROID_KEY_PASSWORD }}" `
          -p:AndroidSigningStorePass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" `
          -o ./publish/android
      
    - name: Upload Android App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-app
        path: ./publish/android/*.apk
        if-no-files-found: warn
        
    - name: Upload to Google Play Store (Internal Testing)
      if: github.ref == 'refs/heads/main'
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: de.openelp.feuerwehr.mobile
        releaseFiles: ./publish/android/*.aab
        track: internal
        status: completed
        
    - name: Upload to Google Play Store (Production)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: de.openelp.feuerwehr.mobile
        releaseFiles: ./publish/android/*.aab
        track: production
        status: completed
