name: Mirror to Upstream Repository

on:
  workflow_dispatch:

jobs:
  generate-release-notes:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Generate tabular release notes
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release = context.payload.release;

            // Find the previous release to determine the time window
            const releasesResp = await github.rest.repos.listReleases({ owner, repo, per_page: 10 });
            const releases = releasesResp.data;
            const currentIndex = releases.findIndex(r => r.id === release.id);
            const previousRelease = currentIndex >= 0 ? releases[currentIndex + 1] : null;
            const since = previousRelease ? previousRelease.published_at : null;
            const until = release.published_at;

            const issueMap = new Map();

            // Method 1: issues linked to the release milestone
            const milestonesResp = await github.rest.issues.listMilestones({ owner, repo, state: 'all', per_page: 100 });
            const milestone = milestonesResp.data.find(m =>
              m.title === release.tag_name || m.title === release.name
            );
            if (milestone) {
              const milestoneIssues = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, milestone: milestone.number, state: 'closed', per_page: 100
              });
              for (const issue of milestoneIssues) {
                if (!issue.pull_request) {
                  issueMap.set(issue.number, issue);
                }
              }
            }

            // Method 2: issues referenced in merged PRs within the release window
            const allPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 100
            });
            const mergedPulls = allPulls.filter(pr =>
              pr.merged_at &&
              new Date(pr.merged_at) <= new Date(until) &&
              (!since || new Date(pr.merged_at) >= new Date(since))
            );

            const linkedIssueNumbers = new Set();
            for (const pr of mergedPulls) {
              if (pr.body) {
                // Matches keywords from https://docs.github.com/en/issues/tracking-your-work-with-issues/linking-a-pull-request-to-an-issue
                const matches = pr.body.matchAll(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)/gi);
                for (const match of matches) {
                  linkedIssueNumbers.add(parseInt(match[1], 10));
                }
              }
            }

            for (const num of linkedIssueNumbers) {
              if (issueMap.has(num)) continue;
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: num });
                if (!issue.pull_request) {
                  issueMap.set(issue.number, issue);
                }
              } catch (e) {
                core.warning(`Could not fetch issue #${num}: ${e.message}`);
              }
            }

            // Build markdown table
            const escapeCell = (text) => String(text).replace(/\|/g, '&#124;');
            const issues = [...issueMap.values()].sort((a, b) => a.number - b.number);
            let table = '## 📋 Bearbeitete Issues\n\n';
            if (issues.length === 0) {
              table += '_Keine verlinkten Issues für dieses Release gefunden._\n';
            } else {
              table += '| # | Titel | Labels | Zugewiesen an | Status |\n';
              table += '|---|-------|--------|---------------|--------|\n';
              for (const issue of issues) {
                const labels = issue.labels.length > 0
                  ? issue.labels.map(l => `\`${escapeCell(l.name)}\``).join(' ')
                  : '–';
                const assignees = issue.assignees.length > 0
                  ? issue.assignees.map(a => `[@${a.login}](${a.html_url})`).join(', ')
                  : '–';
                const status = issue.state === 'closed' ? '✅ Geschlossen' : '🔓 Offen';
                table += `| [#${issue.number}](${issue.html_url}) | ${escapeCell(issue.title)} | ${labels} | ${assignees} | ${status} |\n`;
              }
            }

            // Append table to existing release body (avoid duplicate entries)
            const marker = '<!-- release-notes-table -->';
            const existingBody = release.body || '';
            const bodyWithoutPrevious = existingBody.includes(marker)
              ? existingBody.substring(0, existingBody.indexOf(marker)).trimEnd()
              : existingBody.trimEnd();
            const newBody = bodyWithoutPrevious
              ? `${bodyWithoutPrevious}\n\n---\n\n${marker}\n${table}`
              : `${marker}\n${table}`;

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              body: newBody
            });
            core.info(`Release ${release.tag_name} updated with ${issues.length} issue(s).`);

  mirror:
    runs-on: ubuntu-latest
    needs: [generate-release-notes]
    if: needs.generate-release-notes.result == 'success' || needs.generate-release-notes.result == 'skipped'
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to upstream repository
        env:
          UPSTREAM_URL: ${{ secrets.UPSTREAM_REPO_URL }}
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git push upstream --mirror
