# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request.
#
# To use this workflow, you will need to set up a .github/labeler.yml
# file with configuration.  For more information, see:
# https://github.com/actions/labeler

name: Labeler
on: [pull_request_target]

jobs:
  label:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - name: Ensure configured labels exist
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: |
          const { data: configFile } = await github.rest.repos.getContent({
            ...context.repo,
            path: '.github/labeler.yml'
          });
          const config = Buffer.from(configFile.content, 'base64').toString();
          const labels = [...config.matchAll(/^([A-Za-z0-9_.-]+):\s*$/gm)]
            .map(([, label]) => label);
          const existingLabels = await github.paginate(
            github.rest.issues.listLabelsForRepo,
            { ...context.repo, per_page: 100 }
          );
          const existing = new Set(existingLabels.map(({ name }) => name));

          for (const name of labels) {
            if (existing.has(name)) {
              continue;
            }

            try {
              await github.rest.issues.createLabel({
                ...context.repo,
                name,
                color: 'ededed'
              });
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }

              await github.rest.issues.getLabel({ ...context.repo, name });
            }
          }
    - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
