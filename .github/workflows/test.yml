name: Android secrets check email
on:
  workflow_dispatch:
jobs:
  check-and-send:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Build secrets report
        id: report
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          body="<h1>Android signing secrets</h1><ul>"
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD ANDROID_KEYSTORE_PASSWORD; do
            value="${!name}"
            length=${#value}
            if [ "$length" -gt 0 ]; then status="vorhanden"; else status="LEER / nicht gesetzt"; fi
            body+="<li>${name}: ${status} (Länge: ${length})</li>"
          done
          body+="</ul>"
          echo "body=${body}" >> "$GITHUB_OUTPUT"
      - name: Send email
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7
        with:
          server_address: ${{ secrets.ISSUE_SUMMARY_SMTP_SERVER }}
          server_port: ${{ secrets.ISSUE_SUMMARY_SMTP_PORT }}
          username: ${{ secrets.ISSUE_SUMMARY_SMTP_USERNAME }}
          password: ${{ secrets.ISSUE_SUMMARY_SMTP_PASSWORD }}
          subject: "[${{ github.repository }}] Android secrets check"
          to: ${{ secrets.ISSUE_SUMMARY_EMAIL_TO }}
          from: ${{ secrets.ISSUE_SUMMARY_EMAIL_FROM }}
          secure: true
          html_body: ${{ steps.report.outputs.body }}
