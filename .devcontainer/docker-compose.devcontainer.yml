services:
  workspace:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    init: true
    working_dir: /workspaces/Feuerwehr-KPP
    volumes:
      - ..:/workspaces/Feuerwehr-KPP:cached
    command: sleep infinity
    depends_on:
      - postgres
      - redis
      - pgadmin
    environment:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=feuerwehr;Username=feuerwehr;Password=feuerwehr
      ConnectionStrings__Redis: redis:6379