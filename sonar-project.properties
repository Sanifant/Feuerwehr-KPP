# ---------------------------------------------------------
#   SonarCloud Project Configuration – Feuerwehr-KPP
# ---------------------------------------------------------

sonar.projectKey=Sanifant_Feuerwehr-KPP
sonar.organization=sanifant
sonar.projectName=Feuerwehr-KPP
sonar.projectVersion=1.0

# ---------------------------------------------------------
#   Source & Test Directories
# ---------------------------------------------------------
sonar.sources=src
sonar.tests=src/Desktop/desktop.UnitTests,src/Web/api.UnitTests

# ---------------------------------------------------------
#   Language Settings
# ---------------------------------------------------------
# Deaktiviert Multi-Language-Scan (wichtig!)
sonar.scanner.scanAll=false

# ---------------------------------------------------------
#   File Encoding
# ---------------------------------------------------------
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------
#   Exclusions (optimiert für Desktop, Mobile, Web)
# ---------------------------------------------------------
sonar.exclusions=\
**/bin/**,\
**/obj/**,\
**/*.g.cs,\
**/*.g.i.cs,\
**/*.Designer.cs,\
**/*.axaml.cs,\
**/*.xaml.cs,\
**/wwwroot/**,\
**/Migrations/**,\
**/*.js,\
**/*.html,\
**/*.css,\
**/*.json,\
**/*.ts,\
**/*.map,\
**/*.svg,\
**/*.md,\
**/*.yml,\
**/*.yaml,\
**/*.Dockerfile.original

# ---------------------------------------------------------
#   Test Exclusions
# ---------------------------------------------------------
sonar.test.exclusions=\
**/bin/**,\
**/obj/**,\
**/*.g.cs,\
**/*.g.i.cs,\
**/*.Designer.cs

# ---------------------------------------------------------
#   Coverage (falls du Coverlet nutzt)
# ---------------------------------------------------------
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
