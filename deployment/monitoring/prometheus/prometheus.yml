global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ff-kpp-int-inventory-api'
    metrics_path: /metrics
    static_configs:
      - targets: ['ff-kpp-int-inventory-api:8080']

  - job_name: 'ff-kpp-int-nginx-frontend'
    metrics_path: /metrics
    static_configs:
      - targets: ['ff-kpp-int-nginx-exporter:9113']

  - job_name: 'ff-kpp-int-database'
    metrics_path: /metrics
    static_configs:
      - targets: ['ff-kpp-int-postgres-exporter:9187']

  - job_name: 'ff-kpp-int-cache'
    metrics_path: /metrics
    static_configs:
      - targets: ['ff-kpp-int-redis-exporter:9121']
